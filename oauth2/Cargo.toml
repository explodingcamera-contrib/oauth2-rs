[package]
name = "oauth2"
version = "5.1.0"
edition = "2021"
rust-version = "1.99"
description = "An extensible, strongly-typed implementation of OAuth2"
readme = "../README.md"
repository = "https://github.com/ramosbugs/oauth2-rs"
license = "MIT OR Apache-2.0"

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "github"
required-features = ["reqwest-blocking"]

[[example]]
name = "github_async"
required-features = ["reqwest"]

[[example]]
name = "google"
required-features = ["reqwest-blocking"]

[[example]]
name = "google_devicecode"
required-features = ["reqwest-blocking"]

[[example]]
name = "letterboxd"
required-features = ["reqwest-blocking"]

[[example]]
name = "msgraph"
required-features = ["reqwest-blocking"]

[[example]]
name = "microsoft_devicecode_common_user"
required-features = ["reqwest"]

[[example]]
name = "microsoft_devicecode_tenant_user"
required-features = ["reqwest"]

[[example]]
name = "wunderlist"
required-features = ["reqwest-blocking"]

[dependencies]
base64 = "0.23"
chrono = { version = "0.4.45", default-features = false, features = ["now", "serde"] }
http = "1.5"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1.20"
sha2 = "0.11"
thiserror = "2.0"
ureq = { version = "3", optional = true }
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
anyhow = "1.0"
hex = "0.4"
hmac = "0.13"
oauth2-reqwest = { path = "../oauth2-reqwest" }
tokio = { version = "1.54", features = ["full"] }
uuid = { version = "1.29", features = ["v4"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
curl = { version = "0.4.51", optional = true }

[badges]
maintenance = { status = "actively-developed" }

[features]
default = ["reqwest", "rustls-tls"]
native-tls = ["reqwest/native-tls"]
pkce-plain = []
reqwest-blocking = ["reqwest/blocking"]
rustls-tls = ["reqwest/rustls"]
timing-resistant-secret-traits = []
